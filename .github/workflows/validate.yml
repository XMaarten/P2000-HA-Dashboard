name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check p2000-messages-card.js
      - name: Validate HACS metadata
        run: python3 -m json.tool hacs.json > /dev/null
      - name: Test card rendering
        run: node --test tests/*.test.mjs
